[package]
name = "moldette-resp"
version = "0.0.0"
description = "Turns mapped records into moldette responses"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Kept unpublished until the first public release (#10).
publish = false

[dependencies]
moldette-core = { path = "../moldette-core" }
tracing = { workspace = true, optional = true }

[dev-dependencies]
moldette-test-tracing = { path = "../moldette-test-tracing" }
tracing = { workspace = true }

[features]
tracing = ["dep:tracing"]

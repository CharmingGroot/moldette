[package]
name = "moldette-mapper"
version.workspace = true
description = "Maps parsed fields onto a declared output schema"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["etl", "schema", "mapping", "coercion"]
categories = ["encoding", "text-processing"]

[dependencies]
moldette-core = { workspace = true }
regex = "1.13.1"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
moldette-test-tracing = { path = "../moldette-test-tracing" }
tracing = { workspace = true }

[features]
tracing = ["dep:tracing"]

[package.metadata.docs.rs]
all-features = true

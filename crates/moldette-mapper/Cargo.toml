[package]
name = "moldette-mapper"
version.workspace = true
description = "Maps parsed fields onto a declared output schema"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Kept unpublished until the first public release (#10).
publish = false

[dependencies]
moldette-core = { path = "../moldette-core" }
regex = "1.13.1"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
moldette-test-tracing = { path = "../moldette-test-tracing" }
tracing = { workspace = true }

[features]
tracing = ["dep:tracing"]

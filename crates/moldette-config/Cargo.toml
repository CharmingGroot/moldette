[package]
name = "moldette-config"
version.workspace = true
description = "Builds moldette layer specs from configuration files written in YAML or JSON"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["etl", "yaml", "configuration", "lineage"]
categories = ["config", "parser-implementations"]

[dependencies]
moldette-core = { workspace = true }
moldette-mapper = { workspace = true }
moldette-parser = { workspace = true }
moldette-resp = { workspace = true }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
moldette-spec = { workspace = true }

[package]
name = "moldette-config"
version = "0.0.0"
description = "Builds moldette layer specs from configuration files written in YAML or JSON"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Kept unpublished until the first public release (#10).
publish = false

[dependencies]
moldette-core = { path = "../moldette-core" }
moldette-mapper = { path = "../moldette-mapper" }
moldette-parser = { path = "../moldette-parser" }
moldette-resp = { path = "../moldette-resp" }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = { version = "0.10.9", default-features = false }
yaml-rust2 = { version = "0.13.0", default-features = false }

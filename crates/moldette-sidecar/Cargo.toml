[package]
name = "moldette-sidecar"
version.workspace = true
description = "HTTP sidecar that runs one moldette configuration over streamed records"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["etl", "schema", "sidecar", "http", "records"]
categories = ["web-programming::http-server", "parser-implementations"]

[[bin]]
name = "moldette-sidecar"
path = "src/main.rs"

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server-graceful", "tokio"] }
mimalloc = "0.1.52"
moldette = { workspace = true, features = ["framing"] }
moldette-spec = { workspace = true }
prometheus-client = "0.26.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

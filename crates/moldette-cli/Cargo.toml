[package]
name = "moldette-cli"
version.workspace = true
description = "Command-line tool that checks moldette configurations and runs them over records"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["etl", "schema", "mapping", "cli", "records"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "moldette"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.11"
moldette = { workspace = true, features = ["framing"] }
moldette-spec = { workspace = true }
serde_json = "1.0.154"

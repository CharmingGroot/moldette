[package]
name = "moldette"
version.workspace = true
description = "Turns one raw record into one record of a declared output schema"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["etl", "schema", "mapping", "normalization", "records"]
categories = ["parser-implementations", "encoding", "text-processing"]

[dependencies]
moldette-config = { workspace = true, optional = true }
moldette-core = { workspace = true }
moldette-mapper = { workspace = true, optional = true }
moldette-parser = { workspace = true, optional = true }
moldette-resp = { workspace = true, optional = true }

[dev-dependencies]
moldette-test-tracing = { path = "../moldette-test-tracing" }
tracing = { workspace = true }

[features]
default = ["config"]
parser = ["dep:moldette-parser"]
mapper = ["dep:moldette-mapper"]
resp = ["dep:moldette-resp"]
config = ["dep:moldette-config", "parser", "mapper", "resp"]
tracing = ["moldette-parser?/tracing", "moldette-mapper?/tracing", "moldette-resp?/tracing"]

[package.metadata.docs.rs]
all-features = true

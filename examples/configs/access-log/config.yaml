# nginx access log in the default `combined` format.
schemas:
  - name: access
    version: 1
    fields:
      - {name: client, type: ip, required: true}
      - {name: user, type: string}
      - {name: time, type: timestamp, required: true}
      - {name: method, type: string}
      - {name: path, type: string}
      - {name: http_version, type: string}
      - {name: status, type: int, required: true}
      - {name: status_class, type: string}
      - {name: bytes, type: int}
      - {name: referer, type: string}
      - {name: user_agent, type: string}

parser:
  format: regex
  pattern: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<uri>\S+) (?P<protocol>[^"]+)" (?P<status>\d{3}) (?P<body_bytes_sent>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)"$'
  fields:
    remote_addr: remote_addr
    remote_user: remote_user
    time_local: time_local
    method: method
    uri: uri
    protocol: protocol
    status: status
    body_bytes_sent: body_bytes_sent
    referer: referer
    user_agent: user_agent
  none_values: ["-"]

mapper:
  schema: {name: access, version: 1}
  rules:
    - {target: client, from: remote_addr}
    - {target: user, from: remote_user}
    - target: time
      from: time_local
      via:
        - timestamp:
            formats:
              - "[day]/[month repr:short]/[year]:[hour]:[minute]:[second] [offset_hour][offset_minute]"
    - target: path
      from: uri
      via:
        - split: {separator: "?", index: 0}
    - target: http_version
      from: protocol
      via:
        - extract: {pattern: '^HTTP/(\d(?:\.\d)?)$'}
    - target: status_class
      from: status
      via:
        - extract: {pattern: '^(\d)'}
        - lookup:
            table: {"1": informational, "2": success, "3": redirection, "4": client_error, "5": server_error}
    - {target: bytes, from: body_bytes_sent}

resp:
  schema: {name: access, version: 1}

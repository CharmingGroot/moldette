[package]
name = "moldette-bench-config"
version.workspace = true
description = "Benchmarks of the moldette configuration layer"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
moldette-bench-support = { path = "../support" }
moldette-config = { path = "../../crates/moldette-config" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "allocations"
harness = false

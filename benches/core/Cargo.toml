[package]
name = "moldette-bench-core"
version.workspace = true
description = "Benchmarks of the moldette-core contract types"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
moldette-bench-support = { path = "../support" }
moldette-core = { path = "../../crates/moldette-core" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "allocations"
harness = false

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.affected.outputs.crates }}
      deny: ${{ steps.affected.outputs.deny }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: affected
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/affected.py "origin/${{ github.base_ref }}" HEAD >> "$GITHUB_OUTPUT"
          else
            echo "crates=$(cargo metadata --format-version 1 --no-deps | jq -c '[.packages[].name] | sort')" >> "$GITHUB_OUTPUT"
            echo "deny=true" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/module_graph.py --print

  crate:
    needs: changes
    if: needs.changes.outputs.crates != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.crate }}
      # Built per crate; see #9.
      - run: cargo clippy -p ${{ matrix.crate }} --all-targets
      - run: cargo test -p ${{ matrix.crate }}
      - run: cargo build -p ${{ matrix.crate }} --target wasm32-unknown-unknown
      - run: cargo clippy -p ${{ matrix.crate }} --all-targets --all-features
      - run: cargo test -p ${{ matrix.crate }} --all-features
      - run: cargo build -p ${{ matrix.crate }} --target wasm32-unknown-unknown --all-features
      - name: Each feature alone, for crates with default features
        run: |
          features=$(cargo metadata --format-version 1 --no-deps | jq -r --arg crate "${{ matrix.crate }}" \
            '.packages[] | select(.name == $crate) | .features | select(has("default")) | keys[] | select(. != "default")')
          if [ -n "$features" ]; then
            cargo clippy -p ${{ matrix.crate }} --all-targets --no-default-features
            for feature in $features; do
              cargo clippy -p ${{ matrix.crate }} --all-targets --no-default-features --features "$feature"
            done
          fi

  deny:
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2

  # Single required check; see #9.
  ci-ok:
    needs: [changes, fmt, modules, crate, deny]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}

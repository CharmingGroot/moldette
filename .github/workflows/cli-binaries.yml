name: CLI binaries

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/cli-binaries.yml
      - crates/moldette-cli/Cargo.toml

permissions:
  contents: read

concurrency:
  group: cli-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The Rust image of the sidecar Dockerfile: Linux binaries link musl
  # statically.
  RUST_ALPINE: rust:1.99.0-alpine3.24@sha256:0cce0a5e0e8ba67b455257a3a02a1d99005f382748789d6464460028810f1627

jobs:
  # Pull requests only build and run each binary.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            runs: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            runs: true
          - target: x86_64-apple-darwin
            runner: macos-15
            runs: false
          - target: aarch64-apple-darwin
            runner: macos-15
            runs: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            runs: true
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the workspace version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
      - name: Build in the Rust Alpine image
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD":/src -w /src "$RUST_ALPINE" sh -c \
            "apk add --no-cache musl-dev && cargo build --release --locked -p moldette-cli --target $TARGET"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        if: runner.os != 'Linux'
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p moldette-cli --target "$TARGET"
      - name: Run an example
        if: matrix.runs
        run: |
          binary="target/$TARGET/release/moldette"
          "$binary" --version
          "$binary" run examples/configs/access-log/config.yaml examples/configs/access-log/input.log \
            | diff --strip-trailing-cr - examples/configs/access-log/expected.ndjson
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" != push ]; then version=dev; fi
          name="moldette-cli-$version-$TARGET"
          mkdir -p "dist/$name"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/moldette.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp "target/$TARGET/release/moldette" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -r "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Writes the checksums, attests where each archive was built and attaches
  # the archives to the draft release of the tag.
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME"
          fi
